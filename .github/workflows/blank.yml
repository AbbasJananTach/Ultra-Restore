name: Build Ultra Restore APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Missing Env Files & Fix Signing
        run: |
          touch .env .env.example local.properties
          if [ -f "app/build.gradle.kts" ]; then
            sed -i '/signingConfig = signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts
          fi

      - name: Auto-Inject Storage and Media Permissions
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            for P in READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_MEDIA_AUDIO MANAGE_EXTERNAL_STORAGE CAMERA; do
              grep -q "$P" "$MANIFEST" || sed -i "s|<application|<uses-permission android:name=\"android.permission.$P\" />\n    <application|" "$MANIFEST"
            done
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Ready-APK
          path: app/build/outputs/apk/debug/*.apk
