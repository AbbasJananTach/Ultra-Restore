name: Build Smooth Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Project and Inject Permissions
        run: |
          if [ -f "package.json" ] && [ ! -d "app" ]; then
            npm install --legacy-peer-deps
            npx vite build --base=./ || npm run build
            if [ ! -d "dist" ] && [ -d "build" ]; then
              cp -r build dist
            fi
            if [ ! -d "android" ]; then
              npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --legacy-peer-deps
              rm -f capacitor.config.ts capacitor.config.json
              npx cap init "VisualStudio" "com.abbas.app" --web-dir dist
              npx cap add android
            else
              npx cap sync android
            fi
            find android node_modules/@capacitor -name "*.gradle" -exec sed -i 's/VERSION_21/VERSION_17/g' {} + 2>/dev/null || true
            MANIFEST="android/app/src/main/AndroidManifest.xml"
          else
            touch .env
            if [ -f "app/build.gradle.kts" ]; then
              sed -i '/signingConfig = signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts
            fi
            MANIFEST="app/src/main/AndroidManifest.xml"
          fi

          if [ -f "$MANIFEST" ]; then
            for P in READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_MEDIA_AUDIO MANAGE_EXTERNAL_STORAGE CAMERA; do
              grep -q "$P" "$MANIFEST" || sed -i "s|<application|<uses-permission android:name=\"android.permission.$P\" />\n    <application|" "$MANIFEST"
            done
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Ready-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
