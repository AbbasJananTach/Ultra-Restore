name: Build Android APK with Permissions

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix AI Studio Signing Config
        run: |
          touch .env
          if [ -f "app/build.gradle.kts" ]; then
            sed -i '/signingConfig = signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts
          fi

      - name: Auto-Inject Storage and Media Permissions
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            for PERM in \
              "android.permission.READ_EXTERNAL_STORAGE" \
              "android.permission.WRITE_EXTERNAL_STORAGE" \
              "android.permission.READ_MEDIA_IMAGES" \
              "android.permission.READ_MEDIA_VIDEO" \
              "android.permission.READ_MEDIA_AUDIO" \
              "android.permission.MANAGE_EXTERNAL_STORAGE" \
              "android.permission.CAMERA"; do
              if ! grep -q "$PERM" "$MANIFEST"; then
                sed -i "s|<application|<uses-permission android:name=\"$PERM\" />\n    <application|" "$MANIFEST"
              fi
            done
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Ready-APK
          path: app/build/outputs/apk/debug/*.apk
