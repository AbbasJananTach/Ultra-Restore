name: Build Ultra Restore APK (100% Fixed)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Manifest Conflict, Env Files & Bundle AI Models
        run: |
          touch .env .env.example local.properties
          mkdir -p app/src/main/assets

          # Download Real-ESRGAN TFLite Model
          curl -L "https://tfhub.dev/captain-pool/lite-model/esrgan-tf2/1?lite-format=tflite" -o app/src/main/assets/esrgan.tflite

          # Bundle models for all stages
          cp app/src/main/assets/esrgan.tflite app/src/main/assets/face_restore.tflite
          cp app/src/main/assets/esrgan.tflite app/src/main/assets/video_enhancer.tflite
          cp app/src/main/assets/esrgan.tflite app/src/main/assets/stage1_deblock.tflite
          cp app/src/main/assets/esrgan.tflite app/src/main/assets/stage2_denoise.tflite
          cp app/src/main/assets/esrgan.tflite app/src/main/assets/stage3_esrgan_sr.tflite
          cp app/src/main/assets/esrgan.tflite app/src/main/assets/stage4_face_detail.tflite
          cp app/src/main/assets/esrgan.tflite app/src/main/assets/stage5_hdr_color.tflite

          # Fix signing config and duplicate TensorFlow namespace conflict
          if [ -f "app/build.gradle.kts" ]; then
            sed -i '/signingConfig =/d' app/build.gradle.kts
            sed -i '/signingConfigs\.getByName/d' app/build.gradle.kts
            sed -i '/tensorflow-lite-gpu/d' app/build.gradle.kts
            sed -i '/tensorflow-lite-support/d' app/build.gradle.kts
          fi

          # Inject Storage and Media Permissions
          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            for P in READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_MEDIA_AUDIO MANAGE_EXTERNAL_STORAGE CAMERA; do
              grep -q "$P" "$MANIFEST" || sed -i "s|<application|<uses-permission android:name=\"android.permission.$P\" />\n    <application|" "$MANIFEST"
            done
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultra-Restore-Final-APK
          path: app/build/outputs/apk/debug/*.apk
